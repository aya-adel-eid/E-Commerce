@if (authServices.isAuth()) {
  <nav
    class="fixed inset-x-0 bottom-0 z-50 border-t border-gray-100 bg-white/90 pb-[env(safe-area-inset-bottom)] shadow-[0_-4px_20px_rgba(0,0,0,0.06)] backdrop-blur-md lg:hidden"
    aria-label="Bottom navigation"
  >
    <ul class="mx-auto flex max-w-md items-center justify-around px-2 py-2">
      @for (t of tabs; track t.path) {
        <li class="flex-1">
          <a
            [routerLink]="t.path"
            routerLinkActive="active-tab"
            class="tab group relative flex flex-col items-center gap-0.5 rounded-2xl py-1.5 text-gray-500 transition-colors hover:text-main-600"
          >
            <span
              class="tab-icon relative grid h-8 w-12 place-items-center rounded-full transition-all duration-300"
            >
              <i class="fa-solid {{ t.icon }} text-lg"></i>

              @if (t.path === '/cart' && cartServices.numOfCartItems) {
                <span
                  class="absolute -end-0.5 -top-1 grid min-w-5 place-items-center rounded-full bg-danger px-1 text-[10px] font-bold leading-5 text-white ring-2 ring-white"
                >
                  {{ cartServices.numOfCartItems }}
                </span>
              }
            </span>
            <span class="text-[11px] font-semibold">{{ t.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
}
