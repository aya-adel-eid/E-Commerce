@if (showModal) {

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50" (click)="close()">

  <div class="bg-white rounded-lg w-full max-w-md mx-4 p-6" (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex justify-between items-center mb-4 pb-4 border-b">
      <h3 class="text-xl font-semibold">Sign In Required</h3>
      <button (click)="close()"
        class="text-gray-500 hover:text-gray-700 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>


    <app-login-form (loginSuccess)="onLoginSuccess()"></app-login-form>

  </div>
</div>
}
