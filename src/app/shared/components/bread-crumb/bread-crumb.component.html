<nav aria-label="Breadcrumb">
  <ol class="flex flex-wrap items-center gap-1.5 text-sm sm:text-base rtl:space-x-reverse">
    <!-- Home -->
    <li>
      <a
        routerLink="/home"
        class="inline-flex items-center gap-1.5 rounded-full bg-white px-3 py-1.5 font-medium text-gray-600 shadow-sm ring-1 ring-gray-200 transition hover:bg-main-500 hover:text-white hover:ring-main-500"
      >
        <i class="fa-solid fa-house text-xs"></i>
        <span>Home</span>
      </a>
    </li>

    @for (path of arrPaths(); track $index; let last = $last) {
      <li class="flex items-center gap-1.5">
        <i class="fa-solid fa-chevron-right text-[10px] text-gray-400 rtl:rotate-180"></i>

        @if (last) {
          <a
            [routerLink]="`/${path.toLowerCase()}`"
            aria-current="page"
            class="inline-flex items-center rounded-full bg-main-500 px-3 py-1.5 font-semibold text-white shadow-sm"
          >
            {{ path }}
          </a>
        } @else {
          <a
            [routerLink]="`/${path.toLowerCase()}`"
            class="inline-flex items-center rounded-full bg-white px-3 py-1.5 font-medium text-gray-600 shadow-sm ring-1 ring-gray-200 transition hover:bg-main-500 hover:text-white hover:ring-main-500"
          >
            {{ path }}
          </a>
        }
      </li>
    }
  </ol>
</nav>
