<section class="content">
  @if (!productDetails) {
    <app-loading-screen></app-loading-screen>
  } @else {
    <div class="mt-10">
      <div class="mb-6">
        <app-bread-crumb [arrPaths]="['details', `${productDetails.slug} `]"></app-bread-crumb>
      </div>

      <app-card-details-product
        [product]="productDetails"
        [loading]="load"
      ></app-card-details-product>

      <app-related-peoduct></app-related-peoduct>
    </div>
  }
</section>
