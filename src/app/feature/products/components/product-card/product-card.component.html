<article
  class="group relative flex flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm transition-all duration-500 hover:-translate-y-1 hover:border-main-400 hover:shadow-xl"
  (mouseenter)="currentImag.src = product.images[0] || product.imageCover"
  (mouseleave)="currentImag.src = product.imageCover"
>
  <!-- Image -->
  <div class="relative aspect-square overflow-hidden bg-gray-50">
    @if (product.price | checkprice) {
      <span
        class="absolute left-2.5 top-2.5 z-10 rounded-full bg-danger px-2.5 py-0.5 text-[11px] font-bold text-white shadow"
      >
        {{ product.price | checkprice }}
      </span>
    }

    <a [routerLink]="['/details', product._id, product.slug]" class="block h-full">
      <img
        #currentImag
        imagePlaceHolder
        loading="lazy"
        [src]="product.imageCover"
        [alt]="product.title"
        class="h-full w-full object-contain p-3 transition-transform duration-700 group-hover:scale-105"
      />
    </a>

    <!-- Quick actions -->
    <div
      class="absolute right-2.5 top-2.5 z-10 flex flex-col gap-2 transition-all duration-300 md:translate-x-12 md:opacity-0 md:group-hover:translate-x-0 md:group-hover:opacity-100"
    >
      @if (authServices.isAuth() && wishlistServices.isInWishlist()(product._id)) {
        <button
          type="button"
          (click)="removeProductInWishlist(product._id)"
          aria-label="Remove from wishlist"
          class="grid size-9 cursor-pointer place-items-center rounded-full bg-white text-sm text-red-500 shadow transition hover:bg-red-50"
        >
          <i class="fa-solid fa-heart"></i>
        </button>
      } @else {
        <button
          type="button"
          (click)="addToWishlist(product._id)"
          aria-label="Add to wishlist"
          class="grid size-9 cursor-pointer place-items-center rounded-full bg-white text-sm text-gray-600 shadow transition hover:bg-main-500 hover:text-white"
        >
          <i class="fa-solid fa-heart"></i>
        </button>
      }

      <a
        [routerLink]="['/details', product._id, product.slug]"
        aria-label="View details"
        class="grid size-9 place-items-center rounded-full bg-white text-sm text-gray-600 shadow transition hover:bg-main-500 hover:text-white"
      >
        <i class="fa-solid fa-eye"></i>
      </a>
    </div>
  </div>

  <!-- Info -->
  <div class="flex grow flex-col gap-1.5 p-3">
    <span class="text-[11px] font-semibold uppercase tracking-widest text-main-500">{{
      product.brand.name
    }}</span>

    <a [routerLink]="['/details', product._id, product.slug]">
      <h5
        class="line-clamp-1 text-base font-semibold text-gray-800 transition-colors group-hover:text-main-500"
      >
        {{ product.title }}
      </h5>
    </a>

    <p class="line-clamp-2 min-h-9 text-xs text-gray-500">{{ product.description }}</p>

    <div class="mt-auto flex items-center justify-between border-t border-gray-100 pt-2.5">
      <span class="text-base font-extrabold text-gray-900">{{ product.price }} $</span>
      <span
        class="flex items-center gap-1 rounded-full bg-amber-50 px-2 py-0.5 text-xs font-semibold text-amber-600"
      >
        <i class="fa-solid fa-star text-[10px]"></i> {{ product.ratingsAverage }}
      </span>
    </div>

    <!-- Add to cart (always visible) -->
    <button
      type="button"
      (click)="addProductToCart(product._id)"
      [disabled]="isLoading"
      class="btn-cart mt-1.5 flex w-full items-center justify-center gap-2 py-2 text-sm disabled:cursor-not-allowed disabled:opacity-70"
    >
      @if (isLoading) {
        <span>Adding...</span><i class="fas fa-spinner fa-spin"></i>
      } @else {
        <i class="fa-solid fa-bag-shopping"></i><span>ADD TO CART</span>
      }
    </button>
  </div>
</article>
