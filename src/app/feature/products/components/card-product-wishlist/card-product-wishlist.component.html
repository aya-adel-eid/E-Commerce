<article
  class="relative flex h-full flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm transition-shadow duration-300 hover:shadow-lg"
>
  <!-- Image -->
  <div class="relative aspect-square overflow-hidden bg-gray-50">
    <a [routerLink]="['/details', product._id, product.slug]" class="block h-full">
      <img
        imagePlaceHolder
        loading="lazy"
        [src]="product.imageCover"
        [alt]="product.title"
        class="size-full object-contain p-3"
      />
    </a>

    <!-- Remove from wishlist (always visible) -->
    <button
      type="button"
      (click)="removeProductInWishlist(product._id)"
      aria-label="Remove from wishlist"
      title="Remove from wishlist"
      class="absolute end-2.5 top-2.5 grid size-9 cursor-pointer place-items-center rounded-full bg-white text-red-500 shadow transition hover:bg-red-50 active:scale-95"
    >
      <i class="fa-solid fa-heart text-sm"></i>
    </button>
  </div>

  <!-- Info -->
  <div class="flex grow flex-col gap-1.5 p-3 sm:p-4">
    <span class="text-[11px] font-semibold uppercase tracking-widest text-main-500">
      {{ product.brand.name }}
    </span>

    <a [routerLink]="['/details', product._id, product.slug]">
      <h5
        class="line-clamp-1 text-base font-semibold text-gray-800 transition-colors hover:text-main-500"
      >
        {{ product.title }}
      </h5>
    </a>

    <p class="line-clamp-2 min-h-9 text-xs text-gray-500">{{ product.description }}</p>

    <div class="mt-auto flex items-center justify-between border-t border-gray-100 pt-2.5">
      <span class="text-base font-extrabold text-gray-900">{{ product.price }} $</span>
      <span
        class="flex items-center gap-1 rounded-full bg-amber-50 px-2 py-0.5 text-xs font-semibold text-amber-600"
      >
        <i class="fa-solid fa-star text-[10px]"></i> {{ product.ratingsAverage }}
      </span>
    </div>

    <!-- Actions (always visible) -->
    <div class="mt-1.5 grid grid-cols-[1fr_auto] gap-2">
      <button
        type="button"
        (click)="addProductToCart(product._id)"
        [disabled]="isLoading"
        class="btn-cart flex w-full items-center justify-center gap-2 py-2 text-sm disabled:cursor-not-allowed disabled:opacity-70"
      >
        @if (isLoading) {
          <span>Adding...</span><i class="fas fa-spinner fa-spin"></i>
        } @else {
          <i class="fa-solid fa-bag-shopping"></i><span>ADD TO CART</span>
        }
      </button>

      <a
        [routerLink]="['/details', product._id, product.slug]"
        aria-label="View details"
        class="grid size-10 place-items-center rounded-full border border-gray-200 text-gray-600 transition hover:border-main-500 hover:text-main-500"
      >
        <i class="fa-solid fa-eye"></i>
      </a>
    </div>
  </div>
</article>
