<div class="overflow-hidden rounded-3xl shadow-lg">
  <owl-carousel-o [options]="customOptions">
    @for (slide of slides; track slide.img) {
      <ng-template carouselSlide>
        <div class="relative h-60 sm:h-80 lg:h-105">
          <img [src]="slide.img" [alt]="slide.title" class="h-full w-full object-cover" />

          <!-- gradient overlay -->
          <div
            class="absolute inset-0 bg-linear-to-r from-black/70 via-black/30 to-transparent"
          ></div>

          <!-- content -->
          <div
            class="absolute inset-y-0 start-0 flex max-w-md flex-col justify-center gap-3 px-6 sm:px-12"
          >
            <span
              class="w-fit rounded-full bg-main-500 px-3 py-1 text-xs font-bold uppercase tracking-widest text-white"
            >
              {{ slide.tag }}
            </span>
            <h2 class="text-2xl font-extrabold leading-tight text-white sm:text-4xl">
              {{ slide.title }}
            </h2>
            <p class="hidden text-sm text-white/80 sm:block">{{ slide.text }}</p>
            <a
              routerLink="/products"
              class="mt-1 w-fit rounded-full bg-white px-6 py-2.5 text-sm font-bold text-gray-900 shadow transition hover:bg-main-500 hover:text-white"
            >
              Shop Now <i class="fa-solid fa-arrow-right ms-1"></i>
            </a>
          </div>
        </div>
      </ng-template>
    }
  </owl-carousel-o>
</div>
