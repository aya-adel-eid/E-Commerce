<section class="content pb-12">
  <div class="pb-3 pt-6">
    <app-bread-crumb [arrPaths]="['Login']"></app-bread-crumb>
  </div>

  <div
    class="grid overflow-hidden rounded-[2rem] border border-gray-100 bg-white shadow-xl lg:min-h-[640px] lg:grid-cols-2"
  >
    <!-- Visual side -->
    <div
      class="relative hidden flex-col justify-between overflow-hidden bg-linear-to-br from-main-700 via-main-500 to-main-400 p-10 text-white lg:flex"
    >
      <span class="absolute -end-16 -top-16 size-56 rounded-full bg-white/10"></span>
      <span class="absolute -bottom-20 -start-10 size-52 rounded-full bg-white/10"></span>
      <span
        class="absolute end-12 top-1/2 size-5 rotate-45 rounded-md border-2 border-white/30"
      ></span>

      <div class="relative">
        <span
          class="inline-flex items-center gap-2 rounded-full bg-white/15 px-4 py-1.5 text-xs font-bold uppercase tracking-[0.25em] backdrop-blur"
        >
          <i class="fa-solid fa-cart-shopping text-[11px]"></i>
          Fresh Cart
        </span>
        <h2 class="mt-5 text-4xl font-extrabold leading-tight xl:text-5xl">
          Welcome <span class="text-white/70">back!</span>
        </h2>
        <p class="mt-3 max-w-sm text-white/80">
          Sign in to track your orders, save your favorites and check out faster.
        </p>
      </div>

      <!-- Image: contain so it is never cropped -->
      <div class="relative my-6 grid place-items-center rounded-3xl bg-white/95 p-4 shadow-2xl">
        <img
          class="max-h-64 w-full object-contain"
          src="/images/seasonal-sale-discounts-presents-purchase-visiting-boutiques-luxury-shopping-price-reduction-promotional-coupons-special-holiday-offers-vector-isolated-concept-metaphor-illustration_33.avif"
          alt="Seasonal sale"
          loading="lazy"
        />
      </div>

      <ul class="relative grid grid-cols-3 gap-3 text-center text-xs font-semibold">
        @for (f of icons; track f.text) {
          <li class="rounded-2xl bg-white/10 px-2 py-3 backdrop-blur">
            <i class="fa-solid {{ f.icon }} mb-1.5 block text-lg"></i>
            {{ f.text }}
          </li>
        }
      </ul>
    </div>

    <!-- Form side -->
    <div class="flex items-center justify-center p-6 sm:p-10">
      <div class="w-full max-w-md">
        <div class="mb-8 text-center lg:text-start">
          <span
            class="mx-auto mb-4 grid size-14 place-items-center rounded-2xl bg-main-500/10 text-main-600 lg:mx-0"
          >
            <i class="fa-solid fa-lock text-xl"></i>
          </span>
          <h1 class="text-3xl font-extrabold text-gray-800 sm:text-4xl">
            Sign in to <span class="text-main-500">FreshCart</span>
          </h1>
          <p class="mt-2 text-sm text-gray-500">Enter your details to access your account.</p>
        </div>

        <app-login-form></app-login-form>
      </div>
    </div>
  </div>
</section>
