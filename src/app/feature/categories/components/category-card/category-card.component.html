<a
  [routerLink]="['/categories', category._id]"
  (click)="categoriesServices.getSpecificCategory(category._id)"
  class="group relative flex cursor-pointer flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm transition-all duration-500 hover:-translate-y-1.5 hover:border-main-500 hover:shadow-2xl sm:rounded-3xl"
>
  <!-- Image -->
  <div class="relative aspect-square overflow-hidden bg-gray-100 sm:aspect-4/5">
    <img
      imagePlaceHolder
      loading="lazy"
      [src]="category.image"
      [alt]="category.name"
      class="size-full object-cover transition-transform duration-700 group-hover:scale-110"
    />

    <!-- gradient overlay -->
    <div
      class="absolute inset-0 bg-linear-to-t from-black/60 via-transparent to-transparent opacity-70 transition-opacity duration-500 group-hover:opacity-100"
    ></div>

    <!-- date badge -->
    @if (category.createdAt) {
      <span
        class="absolute start-3 top-3 hidden items-center gap-1.5 rounded-full bg-white/90 px-3 py-1 text-[11px] font-semibold text-gray-600 shadow backdrop-blur sm:inline-flex"
      >
        <i class="fa-regular fa-calendar text-main-500"></i>
        {{ category.createdAt | date: 'mediumDate' }}
      </span>
    }
  </div>

  <!-- Info -->
  <div class="flex items-center justify-between gap-2 p-3 sm:gap-3 sm:p-5">
    <div class="min-w-0">
      <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-main-500 sm:text-[11px]">
        Category
      </span>
      <h5
        class="truncate text-base font-extrabold text-gray-800 transition-colors group-hover:text-main-500 sm:text-xl"
      >
        {{ category.name }}
      </h5>
    </div>

    <span
      class="grid size-9 shrink-0 place-items-center rounded-full bg-main-500/10 text-main-500 transition-all duration-300 group-hover:bg-main-500 group-hover:text-white sm:size-11"
    >
      <i
        class="fa-solid fa-arrow-right text-sm transition-transform duration-300 group-hover:translate-x-0.5 rtl:rotate-180"
      ></i>
    </span>
  </div>
</a>
