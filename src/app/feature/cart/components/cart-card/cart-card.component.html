<article
  class="flex flex-col gap-4 rounded-2xl border border-gray-100 bg-white p-4 shadow-sm transition-shadow duration-300 hover:shadow-md sm:flex-row sm:p-5"
>
  <!-- Image -->
  <div
    class="grid size-28 shrink-0 place-items-center self-center overflow-hidden rounded-xl bg-gray-50 p-2 sm:size-32 sm:self-start"
  >
    <img
      [src]="cartData.imageCover"
      [alt]="cartData.title"
      loading="lazy"
      class="size-full object-contain"
    />
  </div>

  <!-- Details -->
  <div class="flex min-w-0 flex-1 flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
    <div class="min-w-0 space-y-3">
      <!-- Title -->
      <h3 class="line-clamp-2 text-base font-bold text-gray-800 sm:text-lg">
        {{ cartData.title }}
      </h3>

      <!-- Quantity -->
      <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-gray-500">Qty</span>
        <div class="inline-flex items-center rounded-full border border-gray-200 bg-gray-50 p-1">
          <button
            type="button"
            aria-label="Decrease quantity"
            (click)="updateProductCount(count - 1, cartData._id)"
            class="grid size-8 cursor-pointer place-items-center rounded-full text-gray-700 transition hover:bg-white hover:text-main-600 hover:shadow-sm active:scale-95"
          >
            <i class="fa-solid fa-minus text-xs"></i>
          </button>
          <span class="min-w-10 text-center text-sm font-bold text-gray-900">{{ count }}</span>
          <button
            type="button"
            aria-label="Increase quantity"
            (click)="updateProductCount(count + 1, cartData._id)"
            class="grid size-8 cursor-pointer place-items-center rounded-full text-gray-700 transition hover:bg-white hover:text-main-600 hover:shadow-sm active:scale-95"
          >
            <i class="fa-solid fa-plus text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex flex-wrap items-center gap-2">
        <button
          type="button"
          (click)="removeCartItem(cartData._id)"
          class="inline-flex cursor-pointer items-center gap-2 rounded-full px-3.5 py-1.5 text-sm font-medium text-red-600 transition hover:bg-red-50"
        >
          <i class="fa-solid fa-trash text-xs"></i>
          Remove
        </button>

        @if (wishlistServices.isInWishlist()(cartData._id)) {
          <button
            type="button"
            (click)="removeProductInWishlist(cartData._id)"
            class="inline-flex cursor-pointer items-center gap-2 rounded-full bg-red-50 px-3.5 py-1.5 text-sm font-medium text-red-500 transition hover:bg-red-100"
          >
            <i class="fa-solid fa-heart text-xs"></i>
            Saved
          </button>
        } @else {
          <button
            type="button"
            (click)="addToWishlist(cartData._id)"
            class="inline-flex cursor-pointer items-center gap-2 rounded-full px-3.5 py-1.5 text-sm font-medium text-gray-600 transition hover:bg-main-500/10 hover:text-main-600"
          >
            <i class="fa-regular fa-heart text-xs"></i>
            Save for later
          </button>
        }
      </div>
    </div>

    <!-- Price -->
    <div
      class="flex items-center justify-between border-t border-gray-100 pt-3 lg:flex-col lg:items-end lg:justify-center lg:border-0 lg:pt-0"
    >
      <span class="text-sm text-gray-500 lg:hidden">Total</span>
      <div class="text-end">
        <p class="text-xl font-extrabold text-main-600 sm:text-2xl">
          {{ price * count | currency: 'EGP' }}
        </p>
        <p class="text-xs text-gray-500">{{ price | currency: 'EGP' }} each</p>
      </div>
    </div>
  </div>
</article>
